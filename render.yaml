# Render Blueprint — frontend (static, free) + backend (web service).
# Database is on Neon (free, persistent); set DATABASE_URL as a secret in the
# Render dashboard rather than here. See README "Hosting".
services:
  - type: web
    name: bukc-api
    runtime: node
    plan: free # note: free web services sleep after 15 min; upgrade or move to Fly.io for always-on SSE
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in dashboard — the Neon connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # set to the static site URL once known
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: BUKC Sports <noreply@bukc-sports.dev>

  - type: web
    name: bukc-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false # set to the bukc-api URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
